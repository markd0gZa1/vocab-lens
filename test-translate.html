<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>离线翻译测试</title>
<style>
  body { font-family: -apple-system, sans-serif; margin: 0; padding: 20px; background:#12141c; color:#e8e8ee; }
  h1 { font-size: 18px; }
  #log { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 13px; line-height: 1.6; }
  .ok { color:#6ee7a8; } .err { color:#ff7b7b; } .dim { color:#8a8fa3; }
  .row { margin-bottom: 12px; padding: 10px; background:#1c1f2b; border-radius:8px; }
  .en { color:#a8b0c8; } .zh { color:#fff; font-size:15px; }
</style>
</head>
<body>
<h1>OPUS-MT 浏览器离线翻译测试</h1>
<div id="log"></div>
<div id="out"></div>
<script type="module">
const logEl = document.getElementById('log');
const outEl = document.getElementById('out');
const log = (msg, cls='') => {
  logEl.innerHTML += `<span class="${cls}">${msg}</span>\n`;
  console.log(msg);
};

async function main() {
  const tLoad0 = performance.now();
  log('加载 transformers.js …');
  const { pipeline } = await import('./vendor/transformers/tf.bundle.js');
  log(`transformers.js 就绪 ${(performance.now()-tLoad0).toFixed(0)} ms`, 'ok');

  log('加载 OPUS-MT 模型（约 107 MB，首次需下载）…');
  const tModel0 = performance.now();
  const translator = await pipeline('translation', 'opus-mt-en-zh', {
    dtype: 'q8',
    progress_callback: (p) => {
      if (p.status === 'progress' && p.file) {
        log(`  ${p.file} ${p.progress ? p.progress.toFixed(0)+'%' : ''}`, 'dim');
      }
    },
  });
  const modelMs = performance.now() - tModel0;
  log(`模型加载完成 ${(modelMs/1000).toFixed(1)} s`, 'ok');

  const sentences = [
    'I bought a very interesting book yesterday.',
    'Scientists have found that people who exercise regularly are less likely to suffer from heart disease.',
    'Although the government has promised to reduce air pollution, little progress has been made so far.',
  ];

  let total = 0;
  for (const s of sentences) {
    const t0 = performance.now();
    const [res] = await translator(s, { max_new_tokens: 128 });
    const ms = performance.now() - t0;
    total += ms;
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div class="en">${s}</div><div class="zh">${res.translation_text}</div><div class="dim">${ms.toFixed(0)} ms</div>`;
    outEl.appendChild(row);
    log(`翻译耗时 ${ms.toFixed(0)} ms`, 'ok');
  }

  log(`平均 ${(total/sentences.length).toFixed(0)} ms / 句`, 'ok');
  if (performance.memory) {
    log(`JS 堆占用 ${(performance.memory.usedJSHeapSize/1048576).toFixed(0)} MB`, 'dim');
  }
  window.__DONE__ = true;
}

main().catch((e) => {
  log('失败: ' + (e && e.message ? e.message : String(e)), 'err');
  console.error(e);
  window.__ERROR__ = String(e);
});
</script>
</body>
</html>
