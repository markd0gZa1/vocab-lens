<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1e7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="单词视界">
  <title>单词视界</title>
  <script>
    // 先定主题再画，避免开屏闪一下白
    try {
      var saved = localStorage.getItem('vl.theme');
      var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : (dark ? 'dark' : 'light');
    } catch (e) {
      document.documentElement.dataset.theme = 'light';
    }
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <main id="screen"></main>
    <nav id="tabs"></nav>
  </div>
  <div id="overlay" hidden></div>

  <script src="vendor/tesseract.min.js"></script>
  <script src="reading-order.js"></script>
  <script src="dictionary.js"></script>
  <script src="sentence-parse.js"></script>
  <script src="translate.js"></script>
  <script src="app.js"></script>
</body>
</html>
